<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bongo Cat Replica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img id="bongoCat" src="assets/idle.png" alt="Bongo Cat">
  </div>

  <!-- Mobile/Desktop Controls -->
  <div class="buttons">
    <button id="leftBtn">
      <div class="label">Press A</div>
      <img src="assets/paw.png" alt="Left Paw">
    </button>
    <button id="rightBtn">
      <div class="label">Press D</div>
      <img src="assets/paw.png" alt="Right Paw">
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
